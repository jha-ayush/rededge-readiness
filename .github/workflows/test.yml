# .github/workflows/test.yml
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile check (Python)
        run: python -m py_compile rededge.py rededge_mock.py test_rededge.py american_english_check.py

      # The tree is written in American English. The product is for pilots in
      # the United States, and spelling drifts one commit at a time unless
      # something reads every file; this does, against an explicit list.
      - name: American English
        run: python american_english_check.py

      # The suite also holds web/_headers to the page contract: the hosted
      # Content Security Policy must allow the page's own script and forbid
      # inline script, and the local server must send the same headers.
      - name: Run tests
        run: python -m unittest test_rededge -v

      # Two of the three clients are JavaScript. Without the steps below, a
      # syntax error in the iPhone script or the web page ships undetected,
      # because the Python suite cannot see either of them. Node 24 is the
      # current LTS line; 20 left support in April 2026.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Syntax check (iPhone script)
        run: node --check ios/rededge-readiness.scriptable.js

      - name: Syntax check (web client)
        run: node --check web/app.js

      # The readiness logic exists three times, once per client. This is what
      # keeps the copies from drifting apart: it runs every canonical scenario
      # and every probe through the web, iOS and Python evaluators and fails if
      # any two disagree on the verdict or on any individual check. It needs
      # python3 on the PATH, which the setup-python step above provides.
      - name: Cross-client parity
        run: node parity_check.js

      # The web page takes its configuration from URL parameters, so a shared
      # link carries it. This holds that boundary: a malformed threshold must
      # fall back rather than becoming NaN and disabling the check entirely, and
      # a link must not be able to point the tool at a non-local host.
      - name: Web config boundary
        run: node web_config_check.js
